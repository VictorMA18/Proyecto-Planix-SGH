        clerkId:
          type: string
        nombre:
          type: string
          description: Nombre completo (nombres + apellidos)
        nombres:
          type: string
        apellidos:
          type: string
        email:
          type: string
          format: email
        emailVerificado:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Organizacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        slug:
          type: string
        zonaHoraria:
          type: string
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizacionConMiembros:
      allOf:
        - $ref: '#/components/schemas/Organizacion'
        - type: object
          properties:
            miembrosActivos:
              type: integer
              description: Cantidad de miembros con estado ACTIVO en la organización

    Membresia:
      type: object
      description: Pertenencia del usuario autenticado a una organización, con su rol en ella
      properties:
        id:
          type: string
          format: uuid
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          $ref: '#/components/schemas/EstadoMiembro'
        fechaIngreso:
          type: string
          format: date-time
          nullable: true
        organizacion:
          $ref: '#/components/schemas/OrganizacionConMiembros'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CrearOrganizacionInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
        zonaHoraria:
          type: string
          default: America/Lima

    ActualizarOrganizacionInput:
      type: object
      properties:
        nombre:
          type: string
        zonaHoraria:
          type: string
        logoUrl:
          type: string

    Miembro:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario:
          $ref: '#/components/schemas/Usuario'
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          $ref: '#/components/schemas/EstadoMiembro'
        fechaIngreso:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Invitacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          type: string
          enum: [PENDIENTE, ACEPTADA, EXPIRADA, CANCELADA]
        expiraEn:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvitacionCreada:
      allOf:
        - $ref: '#/components/schemas/Invitacion'
        - type: object
          properties:
            token:
              type: string
              description: Código de invitación que debe compartirse con el invitado

    CodigoQR:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        token:
          type: string
        expiraEn:
          type: string
          format: date-time
        qrImageUrl:
          type: string
          description: URL o data-URI de la imagen del QR renderizada
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MovimientoAsistencia:
      type: object
      description: Evento puntual de escaneo (ENTRADA) o confirmación de salida (SALIDA) dentro de una jornada.
      properties:
        id:
          type: string
          format: uuid
        jornadaId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoMovimientoAsistencia'
        hora:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JornadaAsistencia:
      type: object
      description: >
        Jornada de un usuario en una fecha determinada. `horaInicio` es el
        primer escaneo del día; `horaFin` refleja siempre la última salida
        registrada. Entre ambas puede haber varios `movimientos`
        (pares ENTRADA/SALIDA intermedios).
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid
        codigoQrId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
          format: date-time
        horaFin:
          type: string
          format: date-time
          nullable: true
          description: Hora de la última salida registrada; null mientras el usuario esté DENTRO sin haber salido aún
        estadoActual:
          $ref: '#/components/schemas/EstadoJornada'
        movimientos:
          type: array
          description: Movimientos ENTRADA/SALIDA de la jornada, en orden cronológico
          items:
            $ref: '#/components/schemas/MovimientoAsistencia'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JornadaAsistenciaPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JornadaAsistencia'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Tarea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        enlace:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
        creadoPor:
          type: string
          format: uuid
        adjuntos:
          type: array
          description: Material gráfico/archivos que enriquecen la descripción, ordenados por `orden`
          items:
            $ref: '#/components/schemas/TareaAdjunto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TareaAdjunto:
      type: object
      description: >
        Imagen u otro archivo adjunto a la descripción de una tarea. Se
        almacena embebido dentro del registro de la tarea (arreglo
        `adjuntos`), no como un recurso independiente. El archivo en sí
        vive en Cloudinary; el identificador interno de Cloudinary
        (`public_id`) no se expone al cliente, se usa solo en el backend
        para eliminar el asset cuando se borra el adjunto.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador generado por el backend al crear el adjunto (no es una fila de base de datos)
        tipo:
          $ref: '#/components/schemas/TipoAdjunto'
        url:
          type: string
          description: secure_url pública devuelta por Cloudinary
        nombreArchivo:
          type: string
          nullable: true
        tamanoBytes:
          type: integer
          maximum: 10485760
          description: Tamaño en bytes, máximo 10 MB (10485760), validado por el backend antes de subir el archivo
        orden:
          type: integer
          description: Posición de despliegue cuando la tarea tiene varios adjuntos
        createdAt:
          type: string
          format: date-time

    CrearTareaInput:
      type: object
      required: [titulo, fechaInicio]
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        enlace:
          type: string
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time

    ActualizarTareaInput:
      type: object
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        enlace:
          type: string
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time

    AsignacionTarea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tareaId:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoAsignacionTarea'
        completadoEn:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Fecha en que se generó la asignación
        updatedAt:
          type: string
          format: date-time

    Notificacion:
      type: object
      description: >
        Vista combinada (JOIN) entre el evento de notificación y el
        estado de lectura del usuario autenticado. El id expuesto aquí
        corresponde al registro de destinatario (notificaciones_usuario),
        ya que es sobre ese registro que se marca "leída".
      properties:
        id:
          type: string
          format: uuid
          description: id del registro notificaciones_usuario (destinatario)
        notificacionId:
          type: string
          format: uuid
          description: id del evento de notificación (contenido compartido)
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        titulo:
          type: string
        contenido:
          type: string
          nullable: true
        referenciaId:
          type: string
          format: uuid
          nullable: true
        leida:
          type: boolean
        leidaEn:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PushToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        plataforma:
          $ref: '#/components/schemas/PlataformaDispositivo'
        expoPushToken:
          type: string
          nullable: true
        webPushSubscription:
          type: object
          nullable: true
          properties:
            endpoint:
              type: string
            keys:
              type: object
              properties:
                p256dh:
                  type: string
                auth:
                  type: string
        activo:
          type: boolean
        ultimaVezUsado:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReporteHorasUsuario:
      type: object
      properties:
        usuarioId:
          type: string
          format: uuid
        nombreUsuario:
          type: string
        fecha:
          type: string
          format: date
        horasTrabajadas:
          type: number
          format: float
