openapi: 3.0.3
info:
  title: API - Sistema de Gestión de Horarios (SGH)
  description: >
    API REST para el control de asistencia mediante QR, gestión de
    organizaciones, usuarios con roles, calendario dinámico de tareas
    y notificaciones.
  version: 1.0.0
  contact:
    name: Equipo SGH
servers:
  - url: https://api.sgh.example.com/v1
    description: Producción
  - url: https://staging-api.sgh.example.com/v1
    description: Staging
  - url: http://localhost:3000/v1
    description: Desarrollo local

tags:
  - name: Auth
    description: Registro, autenticación y sesión
  - name: Organizaciones
    description: Gestión de organizaciones (tenants)
  - name: Miembros
    description: Gestión de usuarios dentro de una organización
  - name: Invitaciones
    description: Invitación de nuevos miembros
  - name: QR
    description: Generación de códigos QR diarios
  - name: Asistencia
    description: Registro de entrada y salida
  - name: Tareas
    description: Calendario dinámico y tareas
  - name: Notificaciones
    description: Notificaciones del usuario
  - name: Reportes
    description: Reportes de asistencia

security:
  - bearerAuth: []

paths:

  # =====================================================================
  # AUTH
  # La autenticación (credenciales + OAuth 2.0: Google, GitHub, etc.) es
  # gestionada completamente por Clerk desde el cliente (Expo/Web),
  # usando sus SDKs oficiales. Este backend NO expone endpoints de
  # login/registro/refresh propios: solo verifica el JWT emitido por
  # Clerk en cada request (ver securitySchemes.bearerAuth) y mantiene
  # sincronizada la tabla local `usuarios` vía webhook.
  # =====================================================================
  /webhooks/clerk:
    post:
      tags: [Auth]
      summary: Webhook de Clerk para sincronizar usuarios (user.created, user.updated, user.deleted)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type:
                  type: string
                  enum: [user.created, user.updated, user.deleted]
                data:
                  type: object
                  description: Payload de usuario enviado por Clerk
      responses:
        '200':
          description: Evento procesado
        '400':
          description: Firma de webhook inválida

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener el perfil del usuario autenticado (según el JWT de Clerk verificado)
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: JWT ausente o inválido

  # =====================================================================
  # ORGANIZACIONES
  # =====================================================================
  /organizaciones:
    get:
      tags: [Organizaciones]
      summary: Listar organizaciones del usuario autenticado
      responses:
        '200':
          description: Lista de organizaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organizacion'
    post:
      tags: [Organizaciones]
      summary: Crear una nueva organización (el creador queda como ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearOrganizacionInput'
      responses:
        '201':
          description: Organización creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizacion'
        '400':
          description: Datos inválidos (nombre vacío o zona horaria no reconocida)
        '401':
          description: JWT ausente o inválido

  /me/membresias:
    get:
      tags: [Organizaciones]
      summary: Listar las membresías activas del usuario autenticado, con su organización y rol en cada una
      responses:
        '200':
          description: Membresías del usuario (una por organización)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membresia'
        '401':
          description: JWT ausente o inválido

  /organizaciones/{organizacionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Organizaciones]
      summary: Obtener detalle de una organización
      responses:
        '200':
          description: Detalle de la organización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizacion'
        '404':
          description: No encontrada
    patch:
      tags: [Organizaciones]
      summary: Actualizar configuración de una organización
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarOrganizacionInput'
      responses:
        '200':
          description: Organización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizacion'

  # =====================================================================
  # MIEMBROS
  # =====================================================================
  /organizaciones/{organizacionId}/miembros:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Miembros]
      summary: Listar miembros de la organización
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoMiembro'
        - name: rol
          in: query
          schema:
            $ref: '#/components/schemas/RolMiembro'
      responses:
        '200':
          description: Lista de miembros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Miembro'

  /organizaciones/{organizacionId}/miembros/{miembroId}:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
      - name: miembroId
        in: path
        required: true
        description: Identificador de la membresía (`id` del miembro)
        schema:
          type: string
          format: uuid
    get:
      tags: [Miembros]
      summary: Ver el perfil de un miembro activo de la organización
      description: >
        Datos de identidad del miembro y su membresía (rol, estado, fecha de ingreso).
        Cualquier miembro de la organización puede consultarlo.
      responses:
        '200':
          description: Miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
        '400':
          description: Identificador inválido
        '404':
          description: Organización inexistente, el usuario no es miembro o el miembro no existe
    patch:
      tags: [Miembros]
      summary: Cambiar el rol de un miembro
      description: >
        Solo un ADMIN (o SUPER_ADMIN) de la organización. No se puede cambiar el propio rol ni el de
        un SUPER_ADMIN (salvo que quien lo hace también lo sea), y no se puede asignar SUPER_ADMIN.
        El cambio es inmediato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol:
                  type: string
                  enum: [ADMIN, SUPERVISOR, EMPLEADO]
      responses:
        '200':
          description: Miembro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
        '400':
          description: Datos inválidos
        '403':
          description: El usuario no es ADMIN, o intenta modificar a un SUPER_ADMIN
        '404':
          description: Organización inexistente, el usuario no es miembro o el miembro no existe
        '409':
          description: Es el propio rol del usuario, o el miembro ya tiene ese rol
    delete:
      tags: [Miembros]
      summary: Quitar a un miembro del equipo de la organización
      description: >
        Solo un ADMIN (o SUPER_ADMIN). La membresía pasa a `INACTIVO` (se conserva el historial) y
        la persona pierde el acceso a la organización; puede volver con una nueva invitación o
        código. No se puede quitar a uno mismo ni a un SUPER_ADMIN (salvo que quien lo hace también lo sea).
      responses:
        '204':
          description: Miembro quitado
        '403':
          description: El usuario no es ADMIN, o intenta quitar a un SUPER_ADMIN
        '404':
          description: Organización inexistente, el usuario no es miembro o el miembro no existe
        '409':
          description: El usuario intenta quitarse a sí mismo

  /organizaciones/{organizacionId}/miembros/{miembroId}/resumen:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
      - name: miembroId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Miembros]
      summary: Credencial y métricas del mes de un miembro
      description: >
        Turno, entrada de hoy y métricas del mes en curso (puntualidad, horas
        trabajadas frente a la meta, variación semanal y tareas), calculadas en
        la zona horaria de la organización. Lo ven ADMIN, SUPER_ADMIN,
        SUPERVISOR y el propio miembro.
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenMiembro'
        '400':
          description: Identificador inválido
        '403':
          description: Un EMPLEADO consulta el resumen de otro miembro
        '404':
          description: Organización inexistente, el usuario no es miembro o el miembro no existe

  # =====================================================================
  # INVITACIONES
  # =====================================================================
  /organizaciones/{organizacionId}/invitaciones:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    post:
      tags: [Invitaciones]
      summary: Invitar a un usuario a la organización
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, rol]
              properties:
                email:
                  type: string
                  format: email
                rol:
                  $ref: '#/components/schemas/RolMiembro'
      responses:
        '201':
          description: >
            Invitación creada. Incluye `token`, el código que el invitado usa en
            `POST /invitaciones/{token}/aceptar`. Solo lo recibe quien invita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitacionCreada'
        '400':
          description: Datos inválidos (correo o rol)
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Organización inexistente o el usuario no es miembro
        '409':
          description: El correo ya es miembro de la organización o ya tiene una invitación pendiente

  /invitaciones/{token}/aceptar:
    post:
      tags: [Invitaciones]
      summary: Aceptar una invitación mediante su código (invitación personal o código genérico)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitación aceptada, miembro activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Miembro'
        '403':
          description: La invitación personal fue emitida para otro correo
        '404':
          description: Código de invitación inexistente
        '409':
          description: El usuario ya es miembro activo de la organización
        '410':
          description: Invitación o código expirado, o invitación ya utilizada

  /organizaciones/{organizacionId}/equipo:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Miembros]
      summary: Listar el equipo (miembros e invitaciones pendientes) con búsqueda, filtro y paginación
      description: >
        Lectura unificada que alimenta la pantalla «Equipo y Miembros». Mezcla miembros activos
        (`tipo: MIEMBRO`, ordenados por rol y nombre) e invitaciones personales pendientes y
        vigentes (`tipo: INVITACION`, las más recientes primero). La búsqueda ignora mayúsculas y
        acentos. Cualquier miembro de la organización puede consultarlo.
      parameters:
        - name: q
          in: query
          description: Texto a buscar en nombre o correo
          schema:
            type: string
        - name: filtro
          in: query
          schema:
            $ref: '#/components/schemas/FiltroEquipo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página del equipo y conteos por filtro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEquipo'
        '400':
          description: Parámetros inválidos (página, tamaño de página o filtro)
        '404':
          description: Organización inexistente o el usuario no es miembro

  /invitaciones/{invitacionId}/reenviar:
    post:
      tags: [Invitaciones]
      summary: Reenviar una invitación personal (renueva su vigencia 7 días; no se envía correo todavía)
      parameters:
        - name: invitacionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitación reenviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitacionPendiente'
        '400':
          description: Identificador inválido
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Invitación inexistente (o el usuario no es miembro de su organización)
        '410':
          description: La invitación ya fue aceptada o cancelada

  /organizaciones/{organizacionId}/codigos-invitacion:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    post:
      tags: [Invitaciones]
      summary: Generar un código de invitación genérico (cualquier persona con el código se une con el rol indicado)
      description: >
        A diferencia de `POST /organizaciones/{id}/invitaciones`, el código no queda ligado a un
        correo ni se consume al usarlo: lo puede canjear cualquier persona (una vez cada una)
        hasta que expire. Se canjea con `POST /invitaciones/{token}/aceptar`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol, vigenciaMinutos]
              properties:
                rol:
                  type: string
                  enum: [ADMIN, SUPERVISOR, EMPLEADO]
                vigenciaMinutos:
                  type: integer
                  description: Vigencia del código, en minutos
                  enum: [5, 10, 15]
      responses:
        '201':
          description: Código generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigoInvitacion'
        '400':
          description: Datos inválidos (rol o vigencia fuera de los valores permitidos)
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Organización inexistente o el usuario no es miembro

  /organizaciones/{organizacionId}/inicio/mio:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Asistencia]
      summary: Jornada de hoy, turno y resumen de la semana del usuario (pestaña Inicio, todos los roles)
      description: >
        Incluye las tareas asignadas al usuario que empiezan hoy y su avance de la semana.
      responses:
        '200':
          description: Inicio del usuario autenticado en la organización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InicioEmpleado'
        '404':
          description: Organización inexistente o el usuario no es miembro activo

  /organizaciones/{organizacionId}/inicio/panel:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Asistencia]
      summary: Presencia del equipo hoy, puntualidad semanal y asistencias recientes (ADMIN y SUPERVISOR)
      description: >
        El ADMIN (y SUPER_ADMIN) recibe además el QR dinámico vigente; para el SUPERVISOR `qr` es `null`.
      responses:
        '200':
          description: Panel de la organización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelAdmin'
        '403':
          description: El usuario es EMPLEADO
        '404':
          description: Organización inexistente o el usuario no es miembro activo

  /organizaciones/{organizacionId}/turnos:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Asistencia]
      summary: Configuración de turnos (plantillas, personal cubierto y tolerancia de entrada). Solo ADMIN
      responses:
        '200':
          description: Plantillas de turno y resumen de la organización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionTurnos'
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Organización inexistente o el usuario no es miembro activo
    post:
      tags: [Asistencia]
      summary: Crear una plantilla de turno y asignarle miembros (solo ADMIN)
      description: >
        Cada miembro tiene como máximo un turno: quien estaba en otra plantilla pasa a esta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantillaTurnoInput'
      responses:
        '201':
          description: Plantilla creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantillaTurno'
        '400':
          description: >
            Datos inválidos (formato de hora, hora de fin igual a la de inicio, días vacíos o
            repetidos) o algún miembro no pertenece al equipo activo
        '403':
          description: El usuario no es ADMIN de la organización

  /organizaciones/{organizacionId}/turnos/tolerancia:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    patch:
      tags: [Asistencia]
      summary: Cambiar la tolerancia de entrada de la organización (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toleranciaMin]
              properties:
                toleranciaMin:
                  type: integer
                  minimum: 0
                  maximum: 120
      responses:
        '200':
          description: Configuración de turnos actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionTurnos'
        '400':
          description: Tolerancia fuera de rango
        '403':
          description: El usuario no es ADMIN de la organización

  /organizaciones/{organizacionId}/turnos/{turnoId}:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
      - name: turnoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Asistencia]
      summary: Editar una plantilla y reemplazar sus miembros asignados (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantillaTurnoInput'
      responses:
        '200':
          description: Plantilla actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantillaTurno'
        '400':
          description: Datos inválidos o algún miembro no pertenece al equipo activo
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Plantilla inexistente en esta organización
    delete:
      tags: [Asistencia]
      summary: Eliminar una plantilla; sus miembros quedan sin turno (solo ADMIN)
      responses:
        '204':
          description: Plantilla eliminada
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Plantilla inexistente en esta organización

  # =====================================================================
  # QR
  /organizaciones/{organizacionId}/qr/hoy:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [QR]
      summary: QR dinámico vigente (solo ADMIN)
      description: >
        Crea el QR del día si aún no existe (un secreto por organización y fecha) y devuelve el
        texto firmado de la ventana actual, que rota cada `ventanaSeg` segundos. Una copia
        compartida o descargada deja de servir al vencer su ventana (`expiraEn`).
      responses:
        '200':
          description: QR vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrDinamico'
        '403':
          description: El usuario no es ADMIN de la organización
        '404':
          description: Organización inexistente o el usuario no es miembro activo

  # =====================================================================
  # ASISTENCIA
  # =====================================================================
  /asistencia/entrada:
    post:
      tags: [Asistencia]
      summary: >
        Registrar una entrada escaneando el QR vigente. Si el usuario no tiene jornada hoy en esa
        organización, la crea (copiando su turno y evaluando la puntualidad); si la jornada está
        `FUERA`, registra un retorno sobre la misma jornada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 200
                  description: Texto leído del QR (la organización sale de él)
      responses:
        '201':
          description: Entrada (o retorno) registrada; devuelve la jornada con sus movimientos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JornadaAsistencia'
        '400':
          description: >
            QR inválido, alterado o vencido, o la jornada ya está `DENTRO` (debe registrarse la
            salida antes de una nueva entrada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El usuario no es miembro activo de la organización del QR

  /asistencia/salida:
    post:
      tags: [Asistencia]
      summary: >
        Registrar una salida (intermedia o final) sobre la jornada abierta. No requiere QR y la
        hora la pone siempre el servidor. `horaFin` queda con la última salida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizacionId]
              properties:
                organizacionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Salida registrada; devuelve la jornada actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JornadaAsistencia'
        '400':
          description: Cuerpo inválido (incluye campos no permitidos como `horaSalida`)
        '404':
          description: No hay una jornada `DENTRO` o el usuario no es miembro activo

  /asistencia/hoy:
    get:
      tags: [Asistencia]
      summary: Turno de hoy, tolerancia y jornada en curso del usuario autenticado
      parameters:
        - name: organizacionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado de asistencia de hoy (`jornada` es `null` si aún no registra entrada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenciaHoy'
        '404':
          description: Organización inexistente o el usuario no es miembro activo

  /asistencia/historial:
    get:
      tags: [Asistencia]
      summary: Historial de jornadas de asistencia del usuario autenticado
      parameters:
        - name: organizacionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Historial paginado de jornadas, cada una con sus movimientos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JornadaAsistenciaPage'

  # =====================================================================
  # TAREAS
  # =====================================================================
  /organizaciones/{organizacionId}/tareas:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Tareas]
      summary: "Tareas de la organización para el calendario (todos los roles)"
      description: >
        Devuelve las tareas que empiezan entre `desde` y `hasta` (fechas locales de la organización)
        con su estado, prioridad y personas asignadas. La pestaña «Tareas» ya lo usa con datos de
        ejemplo; los filtros de prioridad y estado se aplican en la app sobre el mes cargado.
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          description: Rango de hasta 62 días (un mes visible del calendario)
          schema:
            type: string
            format: date
        - name: miembroId
          in: query
          description: Solo las tareas asignadas a este miembro
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tareas del rango, ordenadas por `fechaInicio`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TareaCalendario'
        '404':
          description: Organización inexistente o el usuario no es miembro activo
    post:
      tags: [Tareas]
      summary: >
        Crear una tarea (ADMIN y SUPERVISOR). Se asigna a `miembroIds` o, si se omite, a todos los
        miembros activos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTareaInput'
      responses:
        '201':
          description: Tarea creada y asignada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaDetalle'
        '403':
          description: El usuario es EMPLEADO

  /tareas/{tareaId}:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tareas]
      summary: "Detalle de una tarea (cualquier miembro de su organización)"
      responses:
        '200':
          description: Detalle de la tarea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaDetalle'
        '404':
          description: Tarea inexistente o de otra organización
    patch:
      tags: [Tareas]
      summary: "Editar una tarea (ADMIN y SUPERVISOR); reemplaza asignados, etiquetas y subtareas"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTareaInput'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaDetalle'
        '400':
          description: Datos inválidos (título vacío, hora de fin anterior a la de inicio…)
        '403':
          description: El usuario es EMPLEADO
    delete:
      tags: [Tareas]
      summary: "Eliminar una tarea (ADMIN y SUPERVISOR)"
      responses:
        '204':
          description: Tarea eliminada
        '403':
          description: El usuario es EMPLEADO

  /tareas/{tareaId}/duplicar:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tareas]
      summary: "Duplicar una tarea con sus asignados, etiquetas y subtareas sin completar (ADMIN y SUPERVISOR)"
      responses:
        '201':
          description: Copia creada con el título «(copia)» y estado PENDIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaDetalle'
        '403':
          description: El usuario es EMPLEADO

  /tareas/{tareaId}/estado:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tareas]
      summary: "Mover la tarea por su flujo (pendiente, en progreso, revisión, completada)"
      description: Lo puede hacer cualquier miembro de la organización (también EMPLEADO); queda en la actividad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoTarea'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaDetalle'

  /tareas/{tareaId}/subtareas/{subtareaId}:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: subtareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tareas]
      summary: "Marcar o desmarcar una subtarea (cualquier miembro; queda en la actividad)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completada]
              properties:
                completada:
                  type: boolean
      responses:
        '200':
          description: Subtarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtarea'

  /tareas/{tareaId}/comentarios:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tareas]
      summary: "Comentarios de la tarea, del más antiguo al más reciente"
      responses:
        '200':
          description: Comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComentarioTarea'
    post:
      tags: [Tareas]
      summary: "Comentar una tarea (cualquier miembro de la organización)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComentarioTarea'

  /tareas/{tareaId}/actividad:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tareas]
      summary: "Historial de cambios de la tarea, del más reciente al más antiguo"
      responses:
        '200':
          description: Actividad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActividadTarea'

  /tareas/{tareaId}/adjuntos:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tareas]
      summary: >
        Adjuntar un PDF o una imagen a una tarea (ADMIN y SUPERVISOR). El cliente envía el archivo
        al backend (nunca directamente a Cloudinary); el backend comprueba el tamaño y el formato
        por el contenido del archivo y solo entonces lo sube a Cloudinary con credenciales que
        viven en el servidor. Los adjuntos de una tarea vienen en su detalle (`GET /tareas/{id}`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: PDF, JPEG, PNG, WebP o GIF de hasta 10 MB
      responses:
        '201':
          description: Adjunto subido a Cloudinary y agregado a la tarea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaAdjunto'
        '400':
          description: Falta el archivo o la tarea ya tiene 10 adjuntos
        '403':
          description: El usuario es EMPLEADO
        '404':
          description: Tarea inexistente o de otra organización
        '413':
          description: El archivo excede el tamaño máximo permitido (10 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: El contenido no es un PDF ni una imagen admitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Cloudinary rechazó la subida (p. ej. la clave de API no tiene permiso para subir)
        '503':
          description: Cloudinary no está configurado en el servidor

  /tareas/{tareaId}/adjuntos/{adjuntoId}:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: adjuntoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Tareas]
      summary: >
        Quitar un adjunto (ADMIN y SUPERVISOR): el backend lo saca del arreglo `adjuntos` de la
        tarea y borra el archivo en Cloudinary con su `public_id` interno.
      responses:
        '204':
          description: Adjunto eliminado
        '403':
          description: El usuario es EMPLEADO
        '404':
          description: Tarea o adjunto inexistente

  /tareas/{tareaId}/adjuntos/{adjuntoId}/archivo:
    parameters:
      - name: tareaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: adjuntoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tareas]
      summary: Contenido del adjunto con su tipo y nombre originales (cualquier miembro de la organización)
      description: >
        La API lo obtiene de Cloudinary y lo reenvía con `Content-Type` real y
        `Content-Disposition` con el nombre original (UTF-8, RFC 6266). Hace falta porque los PDF se
        guardan en Cloudinary sin extensión (sus cuentas gratuitas bloquean la entrega de `.pdf`) y
        se entregarían como `octet-stream` con un nombre interno.
      parameters:
        - name: descargar
          in: query
          description: "`true`: `attachment` (descargar); por defecto `inline` (visor)"
          schema:
            type: boolean
      responses:
        '200':
          description: El archivo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: Parámetro `descargar` inválido
        '404':
          description: Tarea o adjunto inexistente, o de otra organización
        '502':
          description: No se pudo obtener el archivo de Cloudinary

  /me/tareas:
    get:
      tags: [Tareas]
      summary: "Tareas asignadas al usuario autenticado, para su calendario (todos los roles)"
      parameters:
        - name: organizacionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tareas asignadas al usuario, ordenadas por `fechaInicio`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TareaCalendario'

  # =====================================================================
  # NOTIFICACIONES
  # =====================================================================
  /organizaciones/{organizacionId}/notificaciones/difusion:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    post:
      tags: [Notificaciones]
      summary: >
        Enviar una notificación a TODOS los miembros activos de la
        organización (fan-out normalizado: crea 1 evento en
        `notificaciones` + una fila liviana por miembro en
        `notificaciones_usuario`, evitando duplicar título/contenido).
        Mismo patrón usado internamente al crear una tarea, pero
        disponible aquí para avisos generales no atados a una tarea
        específica (ej. anuncios administrativos).
        Requiere rol ADMIN o SUPERVISOR. Cada destinatario la recibe como
        tipo AVISO con `actor` = quien la envió (también quien la envía).
        Con `miembroIds` llega solo a esos miembros activos; sin él, a todos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, contenido]
              properties:
                titulo:
                  type: string
                  minLength: 3
                  maxLength: 120
                contenido:
                  type: string
                  minLength: 1
                  maxLength: 500
                miembroIds:
                  type: array
                  minItems: 1
                  description: >
                    Miembros (MiembroOrganizacion.id) que recibirán el aviso.
                    Deben ser miembros activos de la organización (si no, 400).
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: >
            Notificaciones creadas (una fila por miembro activo) y
            despacho de push encolado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificacionesCreadas:
                    type: integer
                    description: Cantidad de miembros activos notificados
        '400':
          description: Título, mensaje o destinatarios inválidos
        '403':
          description: El usuario no es ADMIN ni SUPERVISOR de la organización

  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar notificaciones del usuario autenticado
      description: >
        Más recientes primero. Cada elemento une el evento (`notificaciones`)
        con el estado de lectura del usuario (`notificaciones_usuario`).
      parameters:
        - name: organizacionId
          in: query
          description: Solo las notificaciones de esa organización (la activa en la app).
          schema:
            type: string
            format: uuid
        - name: leida
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'
        '400':
          description: Parámetros inválidos

  /notificaciones/{notificacionId}/leer:
    patch:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      parameters:
        - name: notificacionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notificación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          description: Identificador inválido
        '404':
          description: La notificación no existe o es de otro usuario

  /notificaciones/leer-todas:
    patch:
      tags: [Notificaciones]
      summary: Marcar como leídas todas las notificaciones pendientes del usuario
      parameters:
        - name: organizacionId
          in: query
          description: Solo las de esa organización.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notificaciones marcadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  actualizadas:
                    type: integer
                    description: Cantidad de notificaciones que pasaron a leídas

  /me/preferencias-notificacion:
    get:
      tags: [Notificaciones]
      summary: Preferencias de notificación del usuario autenticado
      description: Si el usuario nunca las guardó, se devuelven los valores por defecto.
      responses:
        '200':
          description: Preferencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasNotificacion'
    put:
      tags: [Notificaciones]
      summary: Guardar las preferencias de notificación del usuario autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasNotificacion'
      responses:
        '200':
          description: Preferencias guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasNotificacion'
        '400':
          description: Datos inválidos

  /push-tokens:
    post:
      tags: [Notificaciones]
      summary: Registrar el identificador de notificaciones push del dispositivo/navegador actual
      description: >
        Si el token (o el `endpoint` de la suscripción web) ya existe, se
        reactiva y pasa al usuario autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plataforma]
              properties:
                plataforma:
                  $ref: '#/components/schemas/PlataformaDispositivo'
                expoPushToken:
                  type: string
                  description: Requerido cuando plataforma es ANDROID o IOS
                webPushSubscription:
                  type: object
                  description: Requerido cuando plataforma es WEB
                  properties:
                    endpoint:
                      type: string
                    keys:
                      type: object
                      properties:
                        p256dh:
                          type: string
                        auth:
                          type: string
      responses:
        '201':
          description: Token/suscripción registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
        '400':
          description: Falta el token o la suscripción que exige la plataforma
    delete:
      tags: [Notificaciones]
      summary: Dejar de recibir push en este dispositivo/navegador (al cerrar sesión)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Uno de los dos, según la plataforma.
              properties:
                expoPushToken:
                  type: string
                endpoint:
                  type: string
                  description: endpoint de la suscripción Web Push
      responses:
        '204':
          description: Token desactivado (o no existía para este usuario)
        '400':
          description: No se indicó ni el token ni el endpoint

  /push-tokens/clave-web:
    get:
      tags: [Notificaciones]
      summary: Clave pública VAPID para suscribir el navegador a Web Push
      responses:
        '200':
          description: Clave pública
          content:
            application/json:
              schema:
                type: object
                properties:
                  clavePublica:
                    type: string
        '503':
          description: Web Push no está configurado en el servidor

  # =====================================================================
  # REPORTES
  # =====================================================================
  /organizaciones/{organizacionId}/reportes/asistencia:
    parameters:
      - $ref: '#/components/parameters/OrganizacionId'
    get:
      tags: [Reportes]
      summary: Horas trabajadas y puntualidad por miembro en un rango de fechas (solo ADMIN)
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          description: No anterior a `desde`; el rango no puede superar 92 días
          schema:
            type: string
            format: date
        - name: miembroId
          in: query
          description: Reporte individual de un miembro
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reporte generado (incluye a todos los miembros activos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteAsistencia'
        '400':
          description: Fechas inválidas, rango invertido o mayor de 92 días
        '403':
          description: El usuario no es ADMIN de la organización

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de sesión emitido por Clerk. El cliente (Expo/Web) lo obtiene
        mediante el SDK de Clerk tras login con credenciales u OAuth 2.0,
        y lo envía en el header Authorization. El backend lo valida usando
        el SDK backend de Clerk (verificación de firma + expiración).

  parameters:
    OrganizacionId:
      name: organizacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    RolMiembro:
      type: string
      enum: [SUPER_ADMIN, ADMIN, SUPERVISOR, EMPLEADO]

    EstadoMiembro:
      type: string
      enum: [ACTIVO, INVITADO, INACTIVO]

    EstadoJornada:
      type: string
      enum: [DENTRO, FUERA]
      description: Indica si el próximo movimiento esperado es una SALIDA (DENTRO) o una ENTRADA/retorno (FUERA)

    TipoMovimientoAsistencia:
      type: string
      enum: [ENTRADA, SALIDA]

    PrioridadTarea:
      type: string
      enum: [ALTA, MEDIA, BAJA]
      description: ALTA se muestra como «Alta prioridad» (urgente) y MEDIA como «Normal»

    EstadoTarea:
      type: string
      enum: [PENDIENTE, EN_PROGRESO, REVISION, COMPLETADA]
      description: >
        Flujo de la tarea («Por hacer», «En progreso», «Revisión», «Completada»). Es de la tarea
        (`tareas.estado`), no de cada persona asignada.

    TipoAdjunto:
      type: string
      enum: [IMAGEN, ARCHIVO]

    TipoNotificacion:
      type: string
      description: >
        La app agrupa los tipos en categorías: Turnos (TURNO_ASIGNADO,
        TURNO_ACTUALIZADO), Tareas (TAREA_ASIGNADA, TAREA_ACTUALIZADA),
        Asistencia (ASISTENCIA_REGISTRADA, QR_DISPONIBLE, RECORDATORIO_ENTRADA,
        RECORDATORIO_SALIDA),
        Avisos (AVISO, los difundidos por ADMIN o SUPERVISOR) y Sistema
        (MIEMBRO_NUEVO, SISTEMA).
      enum:
        - TURNO_ASIGNADO
        - TURNO_ACTUALIZADO
        - TAREA_ASIGNADA
        - TAREA_ACTUALIZADA
        - ASISTENCIA_REGISTRADA
        - QR_DISPONIBLE
        - RECORDATORIO_ENTRADA
        - RECORDATORIO_SALIDA
        - AVISO
        - MIEMBRO_NUEVO
        - SISTEMA

    ModoAlerta:
      type: string
      description: Cómo avisa el dispositivo al llegar una notificación push.
      enum: [SONIDO, VIBRACION, SILENCIO]

    PlataformaDispositivo:
      type: string
      enum: [ANDROID, IOS, WEB]

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clerkId:
          type: string
        nombre:
          type: string
          description: Nombre completo (nombres + apellidos)
        nombres:
          type: string
        apellidos:
          type: string
        email:
          type: string
          format: email
        emailVerificado:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Organizacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        slug:
          type: string
        zonaHoraria:
          type: string
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizacionConMiembros:
      allOf:
        - $ref: '#/components/schemas/Organizacion'
        - type: object
          properties:
            miembrosActivos:
              type: integer
              description: Cantidad de miembros con estado ACTIVO en la organización

    Membresia:
      type: object
      description: Pertenencia del usuario autenticado a una organización, con su rol en ella
      properties:
        id:
          type: string
          format: uuid
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          $ref: '#/components/schemas/EstadoMiembro'
        fechaIngreso:
          type: string
          format: date-time
          nullable: true
        organizacion:
          $ref: '#/components/schemas/OrganizacionConMiembros'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CrearOrganizacionInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
        zonaHoraria:
          type: string
          default: America/Lima

    ActualizarOrganizacionInput:
      type: object
      properties:
        nombre:
          type: string
        zonaHoraria:
          type: string
        logoUrl:
          type: string

    Miembro:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario:
          $ref: '#/components/schemas/Usuario'
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          $ref: '#/components/schemas/EstadoMiembro'
        fechaIngreso:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Invitacion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          type: string
          enum: [PENDIENTE, ACEPTADA, EXPIRADA, CANCELADA]
        expiraEn:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvitacionCreada:
      allOf:
        - $ref: '#/components/schemas/Invitacion'
        - type: object
          properties:
            token:
              type: string
              description: Código de invitación que debe compartirse con el invitado

    FiltroEquipo:
      type: string
      enum: [TODOS, ADMIN, SUPERVISOR, EMPLEADO, PENDIENTES]

    InvitacionPendiente:
      type: object
      properties:
        tipo:
          type: string
          enum: [INVITACION]
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolMiembro'
        enviadaEn:
          type: string
          format: date-time
        expiraEn:
          type: string
          format: date-time

    MiembroEquipo:
      type: object
      properties:
        tipo:
          type: string
          enum: [MIEMBRO]
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          nullable: true
        rol:
          $ref: '#/components/schemas/RolMiembro'
        estado:
          $ref: '#/components/schemas/EstadoMiembro'
        turno:
          type: string
          nullable: true
          description: Nombre de la plantilla de turno asignada
        enTurnoDesde:
          type: string
          format: date-time
          nullable: true
          description: >
            Si está dentro ahora (jornada de hoy o de ayer abierta), desde
            cuándo: la hora de su última entrada.

    PaginaEquipo:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MiembroEquipo'
              - $ref: '#/components/schemas/InvitacionPendiente'
            discriminator:
              propertyName: tipo
        total:
          type: integer
          description: Total de elementos que cumplen el filtro y la búsqueda
        page:
          type: integer
        pageSize:
          type: integer
        conteos:
          type: object
          description: Cantidad por filtro (ignora la búsqueda)
          properties:
            todos:
              type: integer
            admins:
              type: integer
            supervisores:
              type: integer
            empleados:
              type: integer
            pendientes:
              type: integer

    CodigoInvitacion:
      type: object
      properties:
        codigo:
          type: string
        rol:
          $ref: '#/components/schemas/RolMiembro'
        expiraEn:
          type: string
          format: date-time

    InicioEmpleado:
      type: object
      description: Jornada de hoy y semana del usuario (todos los roles). Las tareas son de la Fase 3.
      properties:
        fecha:
          type: string
          format: date
        toleranciaMin:
          type: integer
        turno:
          type: object
          nullable: true
          properties:
            nombre:
              type: string
            inicio:
              type: string
              format: date-time
            fin:
              type: string
              format: date-time
            objetivoMin:
              type: integer
              description: Duración del turno en minutos
        estado:
          $ref: '#/components/schemas/EstadoJornada'
        entrada:
          type: object
          nullable: true
          description: Primera entrada de hoy
          properties:
            registradaEn:
              type: string
              format: date-time
            puntual:
              type: boolean
              nullable: true
              description: null si ese día no tenía turno
            minutosTarde:
              type: integer
              nullable: true
        minutosTrabajados:
          type: integer
          description: Trabajado hoy hasta `calculadoEn`
        calculadoEn:
          type: string
          format: date-time
        semana:
          type: object
          properties:
            minutosTrabajados:
              type: integer
            diasTrabajados:
              type: integer
            variacionPct:
              type: number
              nullable: true
              description: Frente al mismo tramo de la semana anterior
            puntualidad:
              type: number
              nullable: true
              description: Porcentaje de días puntuales entre los días con turno
        tareas:
          type: object
          description: Tareas asignadas al usuario
          properties:
            hoy:
              type: array
              description: Las que empiezan hoy (zona de la organización)
              items:
                $ref: '#/components/schemas/TareaCalendario'
            semana:
              $ref: '#/components/schemas/AvanceTareas'

    AvanceTareas:
      type: object
      description: Tareas de la semana actual (lunes a domingo)
      properties:
        completadas:
          type: integer
        total:
          type: integer

    PanelAdmin:
      type: object
      properties:
        fecha:
          type: string
          format: date
        qr:
          allOf:
            - $ref: '#/components/schemas/QrDinamico'
          nullable: true
          description: Solo para ADMIN (null para SUPERVISOR)
        presencia:
          type: object
          properties:
            esperados:
              type: integer
              description: Miembros activos con turno hoy
            presentes:
              type: integer
              description: Personas DENTRO ahora mismo
            puntuales:
              type: integer
            retrasos:
              type: integer
            pendientes:
              type: integer
              description: Esperados que aún no registran entrada
        puntualidadSemanal:
          type: object
          properties:
            promedio:
              type: number
              nullable: true
            dias:
              type: array
              items:
                type: object
                properties:
                  dia:
                    type: string
                    enum: [L, M, X, J, V]
                  fecha:
                    type: string
                    format: date
                  valor:
                    type: number
                    nullable: true
        asistenciasRecientes:
          type: array
          description: Últimas primeras entradas de hoy (máximo 4)
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Id de la jornada
              miembroId:
                type: string
                format: uuid
                nullable: true
              nombre:
                type: string
              avatarUrl:
                type: string
                nullable: true
              area:
                type: string
                description: Turno con el que entró («Sin turno» si no tenía)
              hora:
                type: string
                format: date-time
              estado:
                type: string
                enum: [PUNTUAL, TARDE, SIN_TURNO]
              minutosTarde:
                type: integer
                nullable: true
        tareasOrganizacion:
          $ref: '#/components/schemas/AvanceTareas'

    PlantillaTurno:
      type: object
      description: Horario recurrente (p. ej. «Turno Mañana Regular») asignable a los miembros de la organización.
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        horaInicio:
          type: string
          example: '07:00'
          description: Hora local `HH:mm` de inicio
        horaFin:
          type: string
          example: '15:30'
        horas:
          type: number
          example: 8.5
          description: Duración del turno en horas
        dias:
          type: array
          description: Días aplicables (1 = lunes … 7 = domingo)
          items:
            type: integer
            minimum: 1
            maximum: 7
        asignados:
          type: integer
          description: Miembros con esta plantilla
        miembroIds:
          type: array
          description: Identificadores de los miembros asignados
          items:
            type: string
            format: uuid
        equipo:
          type: array
          description: Primeros 8 miembros asignados, por nombre (para mostrar sus avatares)
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Id de la membresía
              nombre:
                type: string
              avatarUrl:
                type: string
                nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlantillaTurnoInput:
      type: object
      required: [nombre, horaInicio, horaFin, dias]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 60
        horaInicio:
          type: string
          example: '07:00'
        horaFin:
          type: string
          example: '15:30'
          description: Si es menor que `horaInicio`, el turno cruza la medianoche
        dias:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 7
        miembroIds:
          type: array
          description: Miembros activos asignados a la plantilla (reemplaza la lista anterior)
          items:
            type: string
            format: uuid

    ConfiguracionTurnos:
      type: object
      properties:
        plantillas:
          type: array
          items:
            $ref: '#/components/schemas/PlantillaTurno'
        resumen:
          type: object
          properties:
            activas:
              type: integer
            cubiertos:
              type: integer
              description: Miembros con al menos una plantilla asignada
            toleranciaMin:
              type: integer
              description: Minutos de tolerancia en la entrada

    QrDinamico:
      type: object
      description: >
        Texto del QR para la ventana actual (`PLX1.<codigoQrId>.<ventana>.<firma>`). El secreto del día
        (`codigos_qr.token`) nunca sale del backend.
      properties:
        token:
          type: string
        fecha:
          type: string
          format: date
        expiraEn:
          type: string
          format: date-time
          description: Fin de la ventana actual
        ventanaSeg:
          type: integer

    MovimientoAsistencia:
      type: object
      description: Evento puntual de escaneo (ENTRADA) o confirmación de salida (SALIDA) dentro de una jornada.
      properties:
        id:
          type: string
          format: uuid
        jornadaId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoMovimientoAsistencia'
        hora:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JornadaAsistencia:
      type: object
      description: >
        Jornada de un usuario en una fecha y organización. `horaInicio` es el primer escaneo del
        día; `horaFin`, la última salida. `turno`, `minutosTarde` y `puntual` se copian al registrar
        la primera entrada (null si ese día no tenía turno).
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid
        codigoQrId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
          format: date-time
        horaFin:
          type: string
          format: date-time
          nullable: true
        estadoActual:
          $ref: '#/components/schemas/EstadoJornada'
        turno:
          type: object
          nullable: true
          properties:
            nombre:
              type: string
            inicio:
              type: string
              format: date-time
            fin:
              type: string
              format: date-time
        minutosTarde:
          type: integer
          nullable: true
        puntual:
          type: boolean
          nullable: true
        minutosTrabajados:
          type: integer
          description: Tramos ENTRADA → SALIDA; un tramo abierto cuenta hasta ahora
        movimientos:
          type: array
          description: Movimientos ENTRADA/SALIDA en orden cronológico
          items:
            $ref: '#/components/schemas/MovimientoAsistencia'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AsistenciaHoy:
      type: object
      properties:
        fecha:
          type: string
          format: date
        toleranciaMin:
          type: integer
        turno:
          type: object
          nullable: true
          properties:
            nombre:
              type: string
            inicio:
              type: string
              format: date-time
            fin:
              type: string
              format: date-time
            objetivoMin:
              type: integer
              description: Duración del turno en minutos
        plantilla:
          description: >
            Plantilla de turno asignada al miembro (días, horario y equipo),
            para que cualquier rol vea el detalle de su turno sin acceder a
            la configuración de turnos (solo ADMIN). `null` si no tiene una.
          allOf:
            - $ref: '#/components/schemas/PlantillaTurno'
          nullable: true
        jornada:
          allOf:
            - $ref: '#/components/schemas/JornadaAsistencia'
          nullable: true
        calculadoEn:
          type: string
          format: date-time

    JornadaAsistenciaPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JornadaAsistencia'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Tarea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        enlace:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
        creadoPor:
          type: string
          format: uuid
        adjuntos:
          type: array
          description: Material gráfico/archivos que enriquecen la descripción, ordenados por `orden`
          items:
            $ref: '#/components/schemas/TareaAdjunto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TareaAdjunto:
      type: object
      description: >
        Imagen u otro archivo adjunto a la descripción de una tarea. Se
        almacena embebido dentro del registro de la tarea (arreglo
        `adjuntos`), no como un recurso independiente. El archivo en sí
        vive en Cloudinary; el identificador interno de Cloudinary
        (`public_id`) no se expone al cliente, se usa solo en el backend
        para eliminar el asset cuando se borra el adjunto.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador generado por el backend al crear el adjunto (no es una fila de base de datos)
        tipo:
          $ref: '#/components/schemas/TipoAdjunto'
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp, image/gif]
          description: Detectado por el contenido del archivo, no por la extensión
        url:
          type: string
          description: secure_url pública devuelta por Cloudinary
        nombreArchivo:
          type: string
          nullable: true
        tamanoBytes:
          type: integer
          maximum: 10485760
          description: Tamaño en bytes, máximo 10 MB (10485760), validado por el backend antes de subir el archivo
        orden:
          type: integer
          description: Posición de despliegue cuando la tarea tiene varios adjuntos
        createdAt:
          type: string
          format: date-time

    TareaCalendario:
      type: object
      description: Tarea tal como se muestra en el calendario de la pestaña Tareas
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
          description: Texto con Markdown básico (negrita, cursiva, listas y enlaces)
        prioridad:
          $ref: '#/components/schemas/PrioridadTarea'
        estado:
          $ref: '#/components/schemas/EstadoTarea'
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
          description: Hora de fin del mismo día; es el vencimiento de la tarea
        ubicacion:
          type: string
          nullable: true
          description: Lugar donde se realiza (p. ej. «Torno Norte»)
        etiquetas:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 24
        asignados:
          type: array
          items:
            $ref: '#/components/schemas/PersonaTarea'
        asignadaAMi:
          type: boolean
          description: El usuario autenticado está entre los asignados
        subtareas:
          type: object
          properties:
            completadas:
              type: integer
            total:
              type: integer
        comentarios:
          type: integer
          description: Número de comentarios
        creadaPor:
          $ref: '#/components/schemas/PersonaTarea'

    PersonaTarea:
      type: object
      properties:
        miembroId:
          type: string
          format: uuid
          nullable: true
        nombre:
          type: string
        avatarUrl:
          type: string
          nullable: true

    Subtarea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
          maxLength: 120
        completada:
          type: boolean

    TareaDetalle:
      description: Detalle de una tarea (pantalla de detalle y edición)
      allOf:
        - $ref: '#/components/schemas/TareaCalendario'
        - type: object
          properties:
            listaSubtareas:
              type: array
              items:
                $ref: '#/components/schemas/Subtarea'
            adjuntos:
              type: array
              items:
                $ref: '#/components/schemas/TareaAdjunto'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ComentarioTarea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        autor:
          $ref: '#/components/schemas/PersonaTarea'
        texto:
          type: string
        createdAt:
          type: string
          format: date-time

    ActividadTarea:
      type: object
      description: Evento del historial de una tarea (lo registra el backend en cada cambio)
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [CREADA, EDITADA, ESTADO, ASIGNADOS, SUBTAREA, COMENTARIO, ADJUNTO, DUPLICADA]
        actor:
          $ref: '#/components/schemas/PersonaTarea'
        descripcion:
          type: string
          description: Texto legible (p. ej. «movió la tarea a Revisión»)
        createdAt:
          type: string
          format: date-time

    CrearTareaInput:
      type: object
      description: >
        Cuerpo de crear (`POST`) y de editar (`PATCH`, reemplazo completo: asignados, etiquetas y
        subtareas se sustituyen por los enviados). Los adjuntos se gestionan aparte.
      required: [titulo, fechaInicio, miembroIds]
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        descripcion:
          type: string
          maxLength: 2000
          description: Markdown básico (negrita, cursiva, listas y enlaces)
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoTarea'
          default: PENDIENTE
        prioridad:
          allOf:
            - $ref: '#/components/schemas/PrioridadTarea'
          default: MEDIA
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
          description: No anterior a `fechaInicio` y del mismo día en la zona de la organización
        ubicacion:
          type: string
          maxLength: 120
        etiquetas:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 24
        miembroIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Membresías ACTIVAS de la organización a las que se asigna la tarea
          items:
            type: string
            format: uuid
        subtareas:
          type: array
          maxItems: 50
          description: Lista completa de subtareas (las que no tienen `id` se crean; las que faltan se borran)
          items:
            type: object
            required: [titulo, completada]
            properties:
              id:
                type: string
                format: uuid
              titulo:
                type: string
                minLength: 1
                maxLength: 120
              completada:
                type: boolean

    Notificacion:
      type: object
      description: >
        Vista combinada (JOIN) entre el evento de notificación y el
        estado de lectura del usuario autenticado. El id expuesto aquí
        corresponde al registro de destinatario (notificaciones_usuario),
        ya que es sobre ese registro que se marca "leída".
      properties:
        id:
          type: string
          format: uuid
          description: id del registro notificaciones_usuario (destinatario)
        notificacionId:
          type: string
          format: uuid
          description: id del evento de notificación (contenido compartido)
        organizacionId:
          type: string
          format: uuid
          nullable: true
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        titulo:
          type: string
        contenido:
          type: string
          nullable: true
        referenciaId:
          type: string
          format: uuid
          nullable: true
          description: >
            Tarea (TAREA_*) o plantilla de turno (TURNO_*) a la que lleva
            la notificación.
        actor:
          type: object
          nullable: true
          description: >
            Quién provocó el evento (null en los avisos del sistema). La app
            resalta su nombre dentro de `contenido`.
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        asistencia:
          type: object
          nullable: true
          description: Solo en ASISTENCIA_REGISTRADA.
          properties:
            puntual:
              type: boolean
            turno:
              type: string
              description: Nombre y horario del turno, p. ej. «Turno A (09:00 - 18:00)».
        leida:
          type: boolean
        leidaEn:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PreferenciasNotificacion:
      type: object
      required: [push, recordatoriosFichaje, novedadesTareas, modoAlerta]
      properties:
        push:
          type: boolean
          description: Turnos asignados, cambios y avisos urgentes por push.
          default: true
        recordatoriosFichaje:
          type: boolean
          description: Aviso 15 min antes del inicio y del término del turno.
          default: true
        novedadesTareas:
          type: boolean
          description: Avances, comentarios y subtareas de las tareas asignadas.
          default: true
        modoAlerta:
          $ref: '#/components/schemas/ModoAlerta'

    PushToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        plataforma:
          $ref: '#/components/schemas/PlataformaDispositivo'
        expoPushToken:
          type: string
          nullable: true
        webPushSubscription:
          type: object
          nullable: true
          properties:
            endpoint:
              type: string
            keys:
              type: object
              properties:
                p256dh:
                  type: string
                auth:
                  type: string
        activo:
          type: boolean
        ultimaVezUsado:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResumenMiembro:
      type: object
      properties:
        periodo:
          type: string
          description: Mes en curso, `YYYY-MM`
        turno:
          type: object
          nullable: true
          properties:
            nombre:
              type: string
            horaInicio:
              type: string
              example: '08:00'
            horaFin:
              type: string
              example: '17:00'
        entradaHoy:
          type: string
          format: date-time
          nullable: true
          description: Primera entrada de la jornada de hoy
        puntualidad:
          type: number
          nullable: true
          description: >
            Porcentaje (0-100) de jornadas del mes con puntualidad evaluada que
            fueron puntuales; null si no hay ninguna.
        horas:
          type: object
          properties:
            trabajadas:
              type: number
              description: Horas trabajadas en el mes (1 decimal)
            meta:
              type: number
              description: >
                Duración del turno por cada día aplicable del mes (0 si no
                tiene turno)
            variacionSemana:
              type: number
              description: >
                Horas de esta semana menos las de la anterior hasta el mismo
                día de la semana
        tareas:
          type: object
          properties:
            completadas:
              type: integer
            total:
              type: integer
              description: Tareas asignadas que empiezan en el mes

    ReporteAsistencia:
      type: object
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        totalMinutos:
          type: integer
        filas:
          type: array
          items:
            type: object
            properties:
              miembroId:
                type: string
                format: uuid
              nombre:
                type: string
              email:
                type: string
                format: email
              avatarUrl:
                type: string
                nullable: true
              rol:
                $ref: '#/components/schemas/RolMiembro'
              estado:
                $ref: '#/components/schemas/EstadoMiembro'
              turno:
                type: string
                nullable: true
                description: Plantilla asignada actualmente
              diasTrabajados:
                type: integer
              minutosTrabajados:
                type: integer
              puntuales:
                type: integer
              tardanzas:
                type: integer
              minutosTarde:
                type: integer

